plugins { id 'com.android.application' }

def reference = rootProject.file('../../launcher/app/src/main')
def generatedJava = layout.buildDirectory.dir('generated/reference/java')
def generatedManifest = layout.buildDirectory.file('generated/personal/AndroidManifest.xml')

tasks.register('referenceSources', Sync) {
    from new File(reference, 'java')
    into generatedJava
    doLast {
        // Keep the installed screensaver component while extending its shared implementation.
        def original = new File(generatedJava.get().asFile, 'com/gathin/tvhome/ClockDream.java')
        def renamed = new File(original.parentFile, 'ReferenceClockDream.java')
        renamed.text = original.text.replaceAll('\\bClockDream\\b', 'ReferenceClockDream')
        original.delete()
    }
}

tasks.register('personalManifest') {
    inputs.file(new File(reference, 'AndroidManifest.xml'))
    outputs.file(generatedManifest)
    doLast {
        def manifest = new groovy.util.XmlParser(false, false).parse(new File(reference, 'AndroidManifest.xml'))
        def application = manifest.application[0]
        [['.MainActivity', '.FontHomeActivity'], ['.LauncherSettingsActivity', '.FontSettingsActivity'],
         ['.ClockActivity', '.FontClockActivity']].each { pair ->
            def activity = application.activity.find { it.attributes()['android:name'] == pair[0] }
            if (activity == null) throw new GradleException('Reference activity missing: ' + pair[0])
            activity.attributes()['android:name'] = pair[1]
            def alias = application.appendNode('activity-alias', ['android:name': pair[0],
                'android:targetActivity': pair[1], 'android:exported': activity.attributes()['android:exported']])
            activity.'intent-filter'.toList().each { filter -> activity.remove(filter); alias.append(filter) }
        }
        def output = generatedManifest.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.xml.XmlUtil.serialize(manifest)
    }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '3.5-fonts'
    }
    sourceSets {
        main {
            java.srcDir generatedJava
            res.srcDir new File(reference, 'res')
            manifest.srcFile generatedManifest
        }
        test.java.srcDir rootProject.file('../../launcher/app/src/test/java')
    }
    buildTypes.release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), rootProject.file('../../launcher/app/proguard-rules.pro')
        signingConfig signingConfigs.debug
    }
    packagingOptions.resources.excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.named('preBuild').configure { dependsOn 'personalManifest', 'referenceSources' }
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
