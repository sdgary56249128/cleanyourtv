// Both personal Home screens display Wi-Fi strength without requesting the network name.
ext.hideWifiName = { File source ->
    def code = source.text
    def changes = [
            ['''                String ssid = info != null ? info.getSSID() : null;
''', ''],
            ['''                if (ssid != null) {
                    ssid = ssid.replace("\\"", "").trim();
                    if (!ssid.isEmpty() && !ssid.contains("unknown") && !ssid.equals("0x")) text = ssid;
                }''', '']
        ]
    changes.each { change ->
        if (code.count(change[0]) != 1) throw new GradleException('Personal Wi-Fi status hook changed')
        code = code.replace(change[0], change[1])
    }
    source.text = code
}
